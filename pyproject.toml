[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-minimal-action"
version = "0.1.0"
description = "Task-directed calibration of latent-action world models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["wm_grounding*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
